<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>umote case v5</title>
<style>
:root { --bg: #f6f5f2; --bg2: #ffffff; --ink: #1d2025; --muted: #667080; --line: #d8d5cf; --accent: #c8641e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15171a; --bg2: #1d2024; --ink: #e9e7e2; --muted: #9aa3ad; --line: #353a41; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
#view { width: 100%; height: 560px; border-radius: 8px; background: radial-gradient(#ffffff, #e6e4df); touch-action: none; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--accent); }
label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.dl a { color: var(--accent); font-weight: 500; text-decoration: none; }
.dl a:hover, .dl a:focus-visible { text-decoration: underline; }
.dl span { display: block; color: var(--muted); font-size: 12px; }
</style></head><body><main>
<h1>umote case v5 (%%VERSION%%)</h1>
<p class="sub">Drag to turn, scroll to zoom. Every part prints without supports; orientations are in the list.</p>
<div class="grid">
  <div class="card">
    <div id="view" aria-label="3D model of the assembled remote"></div>
    <div class="bar">
      <button data-v="hero">3/4 front</button><button data-v="front">Face</button><button data-v="back">Back</button>
      <button data-v="side">Side</button><button data-v="crease">Crease</button>
      <label>Explode <input id="ex" type="range" min="0" max="30" value="0"></label>
      <label><input type="checkbox" id="dock"> In the dock</label>
    </div>
  </div>
  <div class="card">
    <h2>Download for slicing</h2>
    <ul class="dl">%%FILES%%</ul>
  </div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
<script>
const M = %%MESHES%%;
const LOOK = %%LOOK%%;
const el = document.getElementById('view');
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); el.appendChild(R.domElement);
const S = new THREE.Scene();
const C = new THREE.PerspectiveCamera(30, 1, 1, 3000); C.up.set(0, -1, 0);
const ctr = new THREE.Vector3(0, 110, 10);
const O = new THREE.OrbitControls(C, R.domElement); O.target.copy(ctr); O.enableDamping = true;
S.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.75));
const d1 = new THREE.DirectionalLight(0xffffff, 0.75); d1.position.set(120, -160, 260); S.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.35); d2.position.set(-150, 300, -200); S.add(d2);
const loader = new THREE.STLLoader(), mesh = {};
for (const k in M) {
  const g = loader.parse(Uint8Array.from(atob(M[k]), c => c.charCodeAt(0)).buffer); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: LOOK[k][0], roughness: LOOK[k][1], metalness: 0 }));
  m.visible = k !== 'dock'; mesh[k] = m; S.add(m);
}
const V = { hero: [240, -170, 420], front: [0, 0, 600], back: [0, 0, -600], side: [520, 0, 10], crease: [90, -80, 110] };
function go(v) { const p = V[v]; C.position.set(ctr.x + p[0], ctr.y + p[1], ctr.z + p[2]); O.update(); }
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
document.getElementById('ex').oninput = e => { const s = +e.target.value; for (const k in mesh) mesh[k].position.z = LOOK[k][2] * s; };
document.getElementById('dock').onchange = e => { if (mesh.dock) mesh.dock.visible = e.target.checked; };
function size() { const w = el.clientWidth, h = el.clientHeight; R.setSize(w, h); C.aspect = w / h; C.updateProjectionMatrix(); }
addEventListener('resize', size); size(); go('hero');
(function loop() { O.update(); R.render(S, C); requestAnimationFrame(loop); })();
</script>
</body></html>
