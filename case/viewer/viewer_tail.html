<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const host = $("view");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
  camera.up.set(0, 0, 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445066, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(-1, -1.4, 2.2); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(1.5, 1, -0.5); scene.add(rim);

  const loader = new THREE.STLLoader();
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4);
  const cache = {};
  function geom(name) {
    if (!cache[name]) {
      const bin = atob(MESHES[name]); const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      cache[name] = loader.parse(buf.buffer);
    }
    return cache[name];
  }

  // per-face classification in print orientation (z up), same rule as the Python check
  function classify(g) {
    const p = g.attributes.position.array, n = p.length / 9;
    let zmin = Infinity; for (let i = 2; i < p.length; i += 3) zmin = Math.min(zmin, p[i]);
    const cls = new Uint8Array(n), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    let ovh = 0, flat = 0;
    for (let f = 0; f < n; f++) {
      const o = f * 9;
      a.set(p[o], p[o + 1], p[o + 2]); b.set(p[o + 3], p[o + 4], p[o + 5]); c.set(p[o + 6], p[o + 7], p[o + 8]);
      const cr = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
      const area = cr.length() / 2; if (!area) continue;
      const nz = cr.z / (2 * area), cz = (a.z + b.z + c.z) / 3;
      if (nz < -0.7072 && cz > zmin + 0.15) {
        if (nz < -0.999) { cls[f] = 2; flat += area; } else { cls[f] = 1; ovh += area; }
      }
    }
    return { cls, ovh, flat, faces: n };
  }

  let group = null, current = "shell";
  const info = {};
  function colorFor(cls, base, showOvh) {
    const col = new THREE.Color(base), co = new THREE.Color(css("--overhang")), cb = new THREE.Color(css("--bridge"));
    return (k) => (showOvh && k === 1 ? co : showOvh && k === 2 ? cb : col);
  }
  function meshFor(name, base, showOvh) {
    const g = geom(name);
    if (!info[name]) info[name] = classify(g);
    const { cls } = info[name];
    const colors = new Float32Array(g.attributes.position.count * 3);
    const pick = colorFor(cls, base, showOvh);
    for (let f = 0; f < cls.length; f++) { const c = pick(cls[f]); for (let v = 0; v < 3; v++) colors.set([c.r, c.g, c.b], (f * 3 + v) * 3); }
    g.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0.0,
      side: THREE.DoubleSide, clippingPlanes: [clip], polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
    const grp = new THREE.Group(); grp.add(m);
    if ($("c-edge").checked) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 40),
        new THREE.LineBasicMaterial({ color: new THREE.Color(css("--crease")), transparent: true, opacity: 0.55, clippingPlanes: [clip] }));
      grp.add(e);
    }
    return grp;
  }

  function fmt(v, d = 1) { return v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function build(keepCamera) {
    if (group) { scene.remove(group); group.traverse((o) => { if (o.isLineSegments) o.geometry.dispose(); }); }
    group = new THREE.Group();
    const showOvh = $("c-ovh").checked;
    const names = current === "asm" ? [["asm_shell", css("--part"), false], ["asm_back", css("--part2"), false], ["asm_caps", css("--accent"), false], ["asm_board", css("--bridge"), false]] : [[current, css("--part"), showOvh]];
    for (const [n, base, ov] of names) group.add(meshFor(n, base, ov));
    scene.add(group);
    scene.background = new THREE.Color(css("--stage"));
    const box = new THREE.Box3().setFromObject(group), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    group.userData = { box, size, ctr };
    updateCut();
    // stats
    const rows = [["Size (x × y × z)", `${fmt(size.x)} × ${fmt(size.y)} × ${fmt(size.z)} mm`]];
    if (current === "asm") rows.push(["Faces", names.reduce((s, [n]) => s + info[n].faces, 0).toLocaleString()],
      ["Note", "model orientation, not print"]);
    else { const i = info[current]; rows.push(["Faces", i.faces.toLocaleString()], ["Overhang > 45°", fmt(i.ovh, 2) + " mm²"], ["Flat bridges", fmt(i.flat, 2) + " mm²"]); }
    $("stats").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    if (!keepCamera) {
      const r = Math.max(size.x, size.y, size.z);
      controls.target.copy(ctr);
      camera.position.set(ctr.x - r * 0.9, ctr.y - r * 1.3, ctr.z + r * 1.1);
      controls.update();
    }
  }
  function updateCut() {
    const v = +$("cut").value;
    if (!group || v >= 100) { clip.constant = 1e4; $("cutv").textContent = "off"; return; }
    const { box } = group.userData, y = box.min.y + (box.max.y - box.min.y) * v / 100;
    clip.constant = y; $("cutv").textContent = `y ≤ ${fmt(y)} mm`;
  }

  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

  document.querySelectorAll("#parts button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#parts button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    current = b.dataset.part; build(false);
  }));
  $("c-ovh").addEventListener("change", () => build(true));
  $("c-edge").addEventListener("change", () => build(true));
  $("cut").addEventListener("input", updateCut);
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener("change", () => build(true));
  new MutationObserver(() => build(true)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  resize(); build(false);
  $("status").textContent = "";
})();
</script>
