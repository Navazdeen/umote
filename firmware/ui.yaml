# LVGL user interface, shared by remote.yaml (the real device) and sim.yaml (desktop SDL window).
# The widgets are built in C++ (ui_lv.h) at the mockup's pixel positions; this file wires them up:
# resources (ui_res.yaml, generated), state globals, and the scripts the device and sim call.
#
# The including file defines the hook scripts:
#   ui_launch(source_id)  ui_power()  ui_tv_key(code)  ui_seek(seconds)  ui_name_source(port, name, go)
#   ui_page_shown(page)  ui_sb_ir(code)  ui_ha(kind, entities, value)
#   ui_wifi_scan()  ui_wifi_join(ssid, password)  ui_settings_changed()

substitutions:
  # Soundbar buttons: the remote's labels; IR codes are the upper-case names (Task 14 fills them).
  sb_inputs: "TV,Bluetooth,Music"
  sb_modes: "Cinema,Voice,Night"
  fw_version: "1.0"

esphome:
  includes:
    - logic.h
    - ui_lv.h

json:

globals:
  - { id: g_board_ok, type: bool, initial_value: 'false' }   # MCP23017 answered at boot
  - { id: g_batt_pct, type: int, initial_value: '100' }
  - { id: g_batt_mv, type: int, initial_value: '0' }
  - { id: g_mode, type: int, initial_value: '0' }            # 0 normal, 1 ultra saver, 2 critical
  - { id: g_net, type: int, initial_value: '0' }             # 0 off, 1 connecting, 2 WiFi up, 3 HA connected
  - { id: g_wake, type: int, initial_value: '0' }            # 0 power-on, 1 key, 2 touch, 3 timer
  - { id: g_stay, type: bool, initial_value: 'false' }       # "stay awake" is on
  - { id: g_ssid, type: std::string, initial_value: '""' }   # filled in by the device on connect
  - { id: g_ip, type: std::string, initial_value: '""' }
  - { id: g_rssi, type: int, initial_value: '0' }            # dBm, 0 = unknown
  # Settings page, kept across restarts
  - { id: g_vol_to_tv, type: bool, restore_value: true, initial_value: 'false' }
  - { id: g_text_large, type: bool, restore_value: true, initial_value: 'false' }
  - { id: g_brightness, type: float, restore_value: true, initial_value: '0.6' }
  - { id: g_sleep_s, type: int, restore_value: true, initial_value: '20' }

lvgl:
  buffer_size: 25%               # no PSRAM: 38 KB draw buffer, partial redraws only
  log_level: WARN
  bg_color: 0x0B0B0C
  text_color: 0xFFFFFF
  text_font: f14
  widgets:
    # Four pages side by side; ui_lv.h builds their contents.
    - tileview:
        id: pages
        width: 240
        height: 320
        scrollbar_mode: "OFF"
        bg_color: 0x0B0B0C
        tiles:
          - { id: page_tv, row: 0, column: 0, dir: RIGHT }
          - { id: page_sb, row: 0, column: 1, dir: HOR }
          - { id: page_home, row: 0, column: 2, dir: HOR }
          - { id: page_set, row: 0, column: 3, dir: LEFT }
    - image: { id: img_keep, src: ic_play_22, hidden: true }   # keeps the LVGL image widget compiled in
  on_boot:
    - script.execute: ui_load_res
    - lambda: |-
        ui::cfg = {id(g_vol_to_tv), id(g_text_large), id(g_brightness), id(g_sleep_s)};
        ui::large_text = id(g_text_large);
        if (ui::large_text) ui::enlarge_fonts();
        ui::hooks.wifi_scan = []() { id(ui_wifi_scan).execute(); };
        ui::hooks.wifi_join = [](const std::string &s, const std::string &p) { id(ui_wifi_join).execute(s, p); };
        ui::hooks.settings_changed = []() {
          id(g_vol_to_tv) = ui::cfg.vol_to_tv;
          id(g_brightness) = ui::cfg.brightness;
          id(g_sleep_s) = ui::cfg.sleep_s;
          bool restart = id(g_text_large) != ui::cfg.text_large;
          id(g_text_large) = ui::cfg.text_large;
          id(ui_settings_changed).execute(restart);
        };
        ui::hooks.launch = [](const std::string &s) { id(ui_launch).execute(s); };
        ui::hooks.power = []() { id(ui_power).execute(); };
        ui::hooks.tv_key = [](const char *c) { id(ui_tv_key).execute(std::string(c)); };
        ui::hooks.seek = [](float s) { id(ui_seek).execute(s); };
        ui::hooks.name_source = [](int p, const std::string &n, bool go) { id(ui_name_source).execute(p, n, go); };
        ui::hooks.page_shown = [](int p) { id(ui_page_shown).execute(p); };
        ui::hooks.sb_ir = [](const std::string &c) { id(ui_sb_ir).execute(c); };
        ui::hooks.ha = [](const std::string &k, const std::string &e, const std::string &v) { id(ui_ha).execute(k, e, v); };
        auto split = [](std::string s) { std::vector<std::string> v; size_t p;
          while ((p = s.find(',')) != std::string::npos) { v.push_back(s.substr(0, p)); s = s.substr(p + 1); }
          v.push_back(s); return v; };
        ui::sb_inputs = split("${sb_inputs}");
        ui::sb_modes = split("${sb_modes}");
        ui::build(id(pages), {id(page_tv), id(page_sb), id(page_home), id(page_set)});
    - script.execute: ui_refresh

packages:
  res: !include ui_res.yaml

interval:
  - interval: 1s
    then:
      - lambda: 'ui::tick_tv(millis());'

script:
  # Status icons and the battery / button-board warning.
  - id: ui_refresh
    then:
      - lambda: |-
          int mode = id(g_mode);
          const char *warn = mode == 2 ? "Battery critical" : mode == 1 ? "Saver mode"
                             : !id(g_board_ok) ? "Touch only" : "";
          ui::set_status(id(g_batt_pct), id(g_net) >= 2, warn, mode ? 0xE5484D : 0xF2A33A);
      - script.execute: ui_about

  # Values shown on the Settings and About views.
  - id: ui_about
    then:
      - lambda: |-
          ui::about.batt_pct = id(g_batt_pct);
          ui::about.batt_mv = id(g_batt_mv);
          ui::about.board = id(g_board_ok);
          ui::about.ssid = id(g_net) >= 2 ? id(g_ssid) : "";
          ui::about.ip = id(g_net) >= 2 ? id(g_ip) : "";
          ui::about.rssi = id(g_rssi);
          ui::about.firmware = "v${fw_version}";
          ui::refresh_settings();

  - id: ui_toast
    parameters: { text: string }
    then:
      - lambda: 'ui::toast(text);'

  # Repaint the TV page from ui::tv (filled by the HA bindings or the sim fixtures).
  - id: ui_render_tv
    then:
      - lambda: 'ui::render_tv(millis());'
